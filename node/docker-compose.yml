# FTDP Reference Node with Source Network defradb.rs (Apache-2.0 / MIT)
# CAUTION: Strictly uses sourcenetwork/defradb.rs (NOT the BSL 1.1 Go binary).
services:
  defradb:
    image: ghcr.io/sourcenetwork/defradb-rs:latest # Pin to an exact release tag in production
    container_name: ftdp-defradb-rs
    restart: unless-stopped
    ports:
      - "9181:9181" # HTTP / GraphQL (DQL) API
      - "9171:9171" # libp2p P2P sync port
    environment:
      DEFRA_KEYRING_SECRET: "${DEFRA_KEYRING_SECRET:-dev-keyring-secret-change-me}"
    volumes:
      - defra_data:/root/.defradb
    command: >
      start
      --url 0.0.0.0:9181
      --p2paddr /ip4/0.0.0.0/tcp/9171
      --acp-enable-local
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9181/health-check || curl -sf http://127.0.0.1:9181/health-check || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ftdp-gateway:
    build:
      context: ..
      dockerfile: node/Dockerfile
    container_name: ftdp-gateway
    restart: unless-stopped
    depends_on:
      defradb:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      FTDP_STORAGE_DRIVER: "defradb"
      DEFRADB_URL: "http://defradb:9181"
      FTDP_DATA_DIR: "/data"
      FTDP_SEED_DEMO: "${FTDP_SEED_DEMO:-true}"
      FTDP_PII_MASTER_KEY: "${FTDP_PII_MASTER_KEY:-change-me-in-production}"
      FTDP_API_KEY: "${FTDP_API_KEY:-}"
      FTDP_JWT_SECRET: "${FTDP_JWT_SECRET:-change-me-in-production}"
      FTDP_RPC_URL: "${FTDP_RPC_URL:-}"
      FTDP_CLIENT_CONFIG_ADDRESS: "${FTDP_CLIENT_CONFIG_ADDRESS:-}"
      FTDP_ACCESS_PERMISSIONS_ADDRESS: "${FTDP_ACCESS_PERMISSIONS_ADDRESS:-}"
      FTDP_OPERATOR_PRIVATE_KEY: "${FTDP_OPERATOR_PRIVATE_KEY:-}"
    volumes:
      - ftdp_gateway_data:/data

volumes:
  defra_data:
  ftdp_gateway_data:
